<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Bonsai</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div id="ui">
      <header>
        <h1>Pixel Bonsai</h1>
        <p>Three.js recreation of davidhol.land's rendering style</p>
      </header>

      <section class="modes">
        <button class="mode active" data-mode="realtime">Real-time</button>
        <button class="mode" data-mode="growth">Growth</button>
        <button class="mode" data-mode="growthmorph">Morph</button>
        <button class="mode" data-mode="raytrace">Path Trace</button>
      </section>

      <section>
        <div class="row">
          <label for="resolution">Vertical resolution</label>
          <span id="resolution-value">300 px</span>
        </div>
        <input id="resolution" type="range" min="120" max="540" step="30" value="300" />
      </section>

      <section class="toggles">
        <button class="toggle" data-flag="motion">Camera drift</button>
        <button class="toggle" data-flag="snap">Texel snap</button>
        <button class="toggle" data-flag="outlines">Outlines</button>
        <button class="toggle" data-flag="clouds">Cloud shadows</button>
        <button class="toggle" data-flag="water">Water reflect</button>
        <button class="toggle" data-flag="godrays">God rays</button>
        <button class="toggle" data-flag="dust">Dust motes</button>
        <button class="toggle" data-flag="rain">Rain</button>
        <button class="toggle" data-flag="cycle">Day cycle</button>
        <button class="toggle" data-flag="night">Night</button>
        <button class="toggle" data-flag="grain">Film grain</button>
      </section>

      <section>
        <div class="row">
          <label for="outline-strength">Outline strength</label>
          <span id="outline-strength-value">0.00</span>
        </div>
        <input id="outline-strength" type="range" min="0" max="2" step="0.05" value="0" />
      </section>

      <footer>
        <span id="fps">–</span>
        <button id="toggle-ui-collapse" title="Hide panel">hide</button>
      </footer>
    </div>

    <button id="ui-show" title="Show panel" hidden>menu</button>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
