<!DOCTYPE html>
<html>
<head>
<title>3D Pixel-Style Tree Growth Simulator</title>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script type="text/javascript" src="./assets/js/glMatrix-0.9.5.min.js"></script>
<script type="text/javascript" src="./assets/js/webgl-utils.js"></script>

<style>
:root {
    --bg-deep:   #14141c;
    --bg-mid:    #1d1d2a;
    --panel:     #2a2a3e;
    --panel-2:   #353550;
    --accent-a:  #c9b870;
    --accent-b:  #6b8eaa;
    --accent-c:  #a8606e;
    --accent-d:  #7a9b6e;
    --text:      #d8d8e0;
    --text-dim:  #8a8aa0;
}

* {
    box-sizing: border-box;
    image-rendering: pixelated;
    -webkit-font-smoothing: none;
    font-smooth: never;
}

body {
    margin: 0;
    padding: 16px;
    font-family: "Press Start 2P", monospace;
    font-size: 8px;
    background:
        repeating-linear-gradient(0deg,
            #14141c 0px, #14141c 2px,
            #18182a 2px, #18182a 4px),
        #14141c;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    line-height: 1.4;
}

#game-frame {
    display: flex;
    gap: 16px;
    padding: 16px;
    background: var(--panel);
    box-shadow:
        0 0 0 4px var(--bg-deep),
        0 0 0 8px var(--accent-d),
        0 0 0 12px var(--bg-deep),
        8px 8px 0 12px rgba(0, 0, 0, 0.6);
}

/* fixed rectangular viewport — portrait, locked aspect ratio */
#ICG-canvas {
    display: block;
    width: 400px;
    height: 720px;
    background: #000;
    image-rendering: pixelated;
    box-shadow:
        0 0 0 2px var(--bg-deep),
        0 0 0 4px var(--accent-a);
}

#ui-panel {
    width: 280px;
    max-height: 720px;
    overflow-y: auto;
    padding: 10px;
    background: var(--bg-deep);
    box-shadow:
        0 0 0 2px var(--bg-deep),
        0 0 0 4px var(--accent-c);
}
#ui-panel::-webkit-scrollbar { width: 8px; }
#ui-panel::-webkit-scrollbar-track { background: var(--panel); }
#ui-panel::-webkit-scrollbar-thumb {
    background: var(--accent-b);
    border: 1px solid var(--bg-deep);
}

#ui-panel h1 {
    margin: 4px 0 2px 0;
    font-size: 11px;
    color: var(--accent-a);
    text-transform: uppercase;
    text-shadow: 2px 2px 0 var(--accent-c);
    text-align: center;
}
#ui-panel .subtitle {
    margin: 0 0 12px 0;
    font-size: 6px;
    color: var(--accent-b);
    text-align: center;
    letter-spacing: 1px;
}

.section {
    margin-bottom: 8px;
    padding: 8px;
    background: var(--panel);
    box-shadow:
        0 0 0 2px var(--bg-deep),
        inset -2px -2px 0 0 rgba(0,0,0,0.4),
        inset  2px  2px 0 0 rgba(255,255,255,0.06);
}
.section-title {
    font-size: 7px;
    color: var(--accent-a);
    margin: 0 0 8px 0;
    text-transform: uppercase;
    letter-spacing: 1px;
}
.section-title::before { content: "» "; color: var(--accent-c); }

select, button.anim-button {
    width: 100%;
    padding: 6px;
    background: var(--bg-deep);
    color: var(--text);
    border: 0;
    font-family: inherit;
    font-size: 7px;
    cursor: pointer;
    outline: none;
    text-transform: uppercase;
    box-shadow:
        inset 2px 2px 0 0 var(--accent-b),
        inset -2px -2px 0 0 var(--bg-mid);
}
select:hover { color: var(--accent-a); }

.row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
}
.row:last-child { margin-bottom: 0; }
.row label {
    flex: 0 0 60px;
    font-size: 7px;
    color: var(--text-dim);
}
.row .val {
    flex: 0 0 32px;
    font-size: 7px;
    color: var(--accent-a);
    text-align: right;
}

input[type=range] {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    background: var(--bg-deep);
    outline: none;
    cursor: pointer;
    box-shadow:
        inset 1px 1px 0 0 var(--bg-mid),
        inset -1px -1px 0 0 var(--accent-b);
}
input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 8px;
    height: 12px;
    background: var(--accent-a);
    cursor: pointer;
    border: 0;
    box-shadow:
        inset 1px 1px 0 0 #fff,
        inset -1px -1px 0 0 var(--accent-c),
        0 0 0 1px var(--bg-deep);
}
input[type=range]::-moz-range-thumb {
    width: 8px;
    height: 12px;
    background: var(--accent-a);
    border: 0;
}

.check-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}
.check-row label {
    display: flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    font-size: 7px;
    color: var(--text);
}
input[type=checkbox] {
    -webkit-appearance: none;
    appearance: none;
    width: 12px;
    height: 12px;
    background: var(--bg-deep);
    cursor: pointer;
    box-shadow:
        inset 1px 1px 0 0 var(--bg-mid),
        inset -1px -1px 0 0 var(--accent-b);
    position: relative;
}
input[type=checkbox]:checked { background: var(--accent-d); }
input[type=checkbox]:checked::after {
    content: "";
    position: absolute;
    left: 3px; top: 1px;
    width: 4px; height: 7px;
    border-right: 2px solid var(--bg-deep);
    border-bottom: 2px solid var(--bg-deep);
    transform: rotate(45deg);
}

button.anim-button {
    background: var(--accent-c);
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 1px;
    text-shadow: 1px 1px 0 var(--bg-deep);
    box-shadow:
        inset 2px 2px 0 0 #c8848e,
        inset -2px -2px 0 0 #6e3540,
        0 0 0 2px var(--bg-deep);
    padding: 8px;
}
button.anim-button:hover {
    background: var(--accent-a);
    color: var(--bg-deep);
    text-shadow: none;
}
button.anim-button:active {
    box-shadow:
        inset -2px -2px 0 0 #c8848e,
        inset 2px 2px 0 0 #6e3540,
        0 0 0 2px var(--bg-deep);
}

#hud {
    position: absolute;
    color: var(--accent-a);
    font-size: 7px;
    padding: 6px;
    pointer-events: none;
    text-shadow: 1px 1px 0 #000;
    letter-spacing: 1px;
}
.canvas-wrap { position: relative; }
</style>

<!-- ============= INSTANCED VOXEL SHADER ============= -->
<script id="voxel-vs" type="x-shader/x-vertex">
    attribute vec3 aPos;       // cube vertex position [-0.5..0.5]
    attribute vec3 aNormal;    // cube face normal
    attribute vec3 aIOffset;   // per-instance world-space center
    attribute vec3 aIColor;    // per-instance base color

    uniform mat4 uMV;
    uniform mat4 uP;
    uniform mat4 uM;           // model matrix (tree-local → world)

    varying vec3 vWorldPos;
    varying vec3 vWorldNormal;
    varying vec3 vColor;

    void main(void) {
        vec3 localPos = aPos + aIOffset;
        vec4 worldPos = uM * vec4(localPos, 1.0);
        vWorldPos    = worldPos.xyz;
        vWorldNormal = mat3(uM) * aNormal;
        vColor       = aIColor;
        gl_Position  = uP * uMV * vec4(localPos, 1.0);
    }
</script>
<script id="voxel-fs" type="x-shader/x-fragment">
    precision mediump float;

    varying vec3 vWorldPos;
    varying vec3 vWorldNormal;
    varying vec3 vColor;

    uniform vec3  uSunDir;
    uniform vec3  uSunColor;
    uniform vec3  uMoonDir;
    uniform vec3  uMoonColor;
    uniform float uAmbient;
    uniform vec3  uSkyTint;
    uniform vec3  uViewPos;
    uniform float uPosterLevels;
    uniform float uFogNear;
    uniform float uFogFar;
    uniform float uFogStrength;

    float poster(float x, float levels) {
        return floor(clamp(x, 0.0, 1.0) * levels) / (levels - 1.0);
    }

    void main(void) {
        vec3 N = normalize(vWorldNormal);
        vec3 V = normalize(uViewPos - vWorldPos);

        float sunDiff  = max(dot(N, normalize(uSunDir)), 0.0);
        float moonDiff = max(dot(N, normalize(uMoonDir)), 0.0);

        sunDiff  = poster(sunDiff,  uPosterLevels);
        moonDiff = poster(moonDiff, uPosterLevels);

        vec3 H  = normalize(normalize(uSunDir) + V);
        float specRaw = pow(max(dot(N, H), 0.0), 24.0);
        float spec = specRaw > 0.55 ? 1.0 : 0.0;

        vec3 ambient = uAmbient * mix(vColor, uSkyTint, 0.35);
        vec3 lit  = vColor * (sunDiff * uSunColor + moonDiff * uMoonColor);
        vec3 hi   = 0.35 * spec * uSunColor;
        vec3 color = ambient + lit + hi;

        // distance fog → mountains and far backdrop tint toward sky
        float dist = length(uViewPos - vWorldPos);
        float fog = clamp((dist - uFogNear) / (uFogFar - uFogNear), 0.0, 1.0) * uFogStrength;
        color = mix(color, uSkyTint, fog);

        gl_FragColor = vec4(color, 1.0);
    }
</script>

<!-- ============= SKY GRADIENT SHADER ============= -->
<script id="sky-vs" type="x-shader/x-vertex">
    attribute vec2 aPos;
    varying vec2 vUV;
    void main(void) {
        vUV = aPos * 0.5 + 0.5;
        gl_Position = vec4(aPos, 0.999, 1.0); // far plane
    }
</script>
<script id="sky-fs" type="x-shader/x-fragment">
    precision mediump float;
    varying vec2 vUV;
    uniform vec3  uSkyTop;
    uniform vec3  uSkyBot;
    uniform float uPosterLevels;
    uniform float uSunHeight;     // sun.y in [-1,1]
    uniform float uTime;

    // mountain silhouette as a sum of cos waves
    float mountainProfile(float x) {
        return 0.16
             + 0.08 * cos(x * 3.0 + 1.2)
             + 0.05 * cos(x * 7.5 - 0.6)
             + 0.025 * cos(x * 17.0 + 2.1);
    }

    // dirt-cheap multi-octave noise for cloud puffs
    float cloudPattern(vec2 uv) {
        vec2 p = uv * vec2(2.5, 1.0) + vec2(uTime * 0.015, 0.0);
        float n = sin(p.x * 6.28 + 0.5) * cos(p.y * 14.0);
        n += 0.55 * sin(p.x * 12.5 + 1.0) * cos(p.y * 7.0 - 1.0);
        n += 0.30 * sin(p.x * 25.0 + 2.0) * cos(p.y * 22.0);
        return smoothstep(0.55, 1.10, n + 0.5);
    }

    void main(void) {
        float t = vUV.y;
        vec3 sky = mix(uSkyBot, uSkyTop, t);

        float dayMix = clamp(uSunHeight * 1.5 + 0.3, 0.0, 1.0);

        // clouds — only above mountain band
        if (vUV.y > 0.30) {
            float c = cloudPattern(vUV);
            vec3 cloudCol = mix(uSkyBot, vec3(1.0, 0.99, 0.96), 0.85);
            cloudCol *= 0.55 + 0.55 * dayMix;
            sky = mix(sky, cloudCol, c * 0.65);
        }

        // mountains
        float mh = mountainProfile(vUV.x);
        if (vUV.y < mh) {
            float k = clamp(vUV.y / mh, 0.0, 1.0);
            // base of mountain darker/greener, peak hazier/bluer
            vec3 mtn = mix(vec3(0.20, 0.32, 0.32), vec3(0.55, 0.66, 0.78), k);
            mtn *= 0.35 + 0.65 * dayMix;
            sky = mix(sky, mtn, 0.92);
        }

        // posterize whole sky into chunky bands
        float bands = max(2.0, uPosterLevels * 2.0);
        sky = floor(sky * bands) / (bands - 1.0);

        gl_FragColor = vec4(sky, 1.0);
    }
</script>

<script type="text/javascript" src="./src/lsystem.js"></script>
<script type="text/javascript" src="./src/voxelizer.js"></script>
<script type="text/javascript" src="./src/climate.js"></script>
<script type="text/javascript" src="./src/daynight.js"></script>
<script type="text/javascript" src="./src/camera.js"></script>
<script type="text/javascript" src="./src/renderer.js"></script>
<script type="text/javascript" src="./src/main.js"></script>
</head>

<body onload="webGLStart();">
<div id="game-frame">
    <div id="ui-panel">
        <h1>TREE SIM</h1>
        <div class="subtitle">3D PIXEL GROWTH</div>

        <div class="section">
            <div class="section-title">Climate</div>
            <select id="climateSelect" onchange="onClimateChange()">
                <option value="temperate" selected>Temperate</option>
                <option value="arid">Arid (Desert)</option>
                <option value="tropical">Tropical</option>
                <option value="snowy">Snowy</option>
            </select>
        </div>

        <div class="section">
            <div class="section-title">Time of Day</div>
            <div class="row">
                <label>Time</label>
                <input id="timeSlider" type="range" min="0" max="1000" value="250" step="1">
                <span class="val" id="timeVal">06:00</span>
            </div>
            <div class="check-row">
                <label><input id="autoTime" type="checkbox" checked> Auto cycle</label>
            </div>
            <div class="row">
                <label>Speed</label>
                <input id="timeSpeed" type="range" min="0" max="100" value="20" step="1">
                <span class="val" id="timeSpeedVal">0.20</span>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Growth</div>
            <div class="row">
                <label>Age</label>
                <input id="ageSlider" type="range" min="0" max="100" value="0" step="1">
                <span class="val" id="ageVal">0</span>
            </div>
            <div class="row">
                <label>Speed</label>
                <input id="growthSpeed" type="range" min="0" max="100" value="20" step="1">
                <span class="val" id="growthSpeedVal">0.20</span>
            </div>
            <div class="check-row">
                <label><input id="autoGrow" type="checkbox" checked> Auto grow</label>
                <label><input id="windToggle" type="checkbox"> Wind</label>
            </div>
            <button class="anim-button" onclick="regenerateTree()" style="margin-top:8px">
                Replant (new seed)
            </button>
        </div>

        <div class="section">
            <div class="section-title">Render</div>
            <div class="row">
                <label>Posterize</label>
                <input id="posterLevels" type="range" min="2" max="8" value="4" step="1">
                <span class="val" id="posterVal">4</span>
            </div>
            <div class="check-row">
                <label><input id="showGround" type="checkbox" checked> Ground</label>
                <label><input id="showSky" type="checkbox" checked> Sky</label>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Stats</div>
            <div id="statVoxels" style="font-size:7px;color:var(--text-dim)">voxels: 0</div>
            <div id="statBranches" style="font-size:7px;color:var(--text-dim)">branches: 0</div>
            <div id="statFps" style="font-size:7px;color:var(--text-dim)">fps: 0</div>
        </div>
    </div>

    <div class="canvas-wrap">
        <canvas id="ICG-canvas" width="200" height="360"></canvas>
        <div id="hud">SAPLING</div>
    </div>
</div>
</body>
</html>
